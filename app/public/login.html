<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập HRM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef3ff;
        }
        .login-box {
            width: 360px;
            max-width: 92%;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px #0001;
        }
        h2 { text-align: center; color: #1756c5; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border-radius: 7px;
            font-size: 15px;
        }
        input { border: 1px solid #ccd3df; }
        button {
            border: none;
            background: #1756c5;
            color: white;
            cursor: pointer;
        }
        #message { color: #d22; font-size: 14px; }
        .hint { color: #555; font-size: 13px; line-height: 1.7; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>HRM Demo</h2>
        <p style="text-align:center">Đăng nhập hệ thống quản lý nhân sự</p>

        <form id="loginForm">
            <input id="username" placeholder="Tên đăng nhập"
                   autocomplete="username" required>
            <input id="password" type="password" placeholder="Mật khẩu"
                   autocomplete="current-password" required>
            <button type="submit">Đăng nhập</button>
        </form>

        <p id="message"></p>
        
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.textContent = "Đang đăng nhập...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent = data.error || "Đăng nhập thất bại.";
                    return;
                }

                window.location.href = "/";
            } catch (error) {
                message.textContent = "Không kết nối được máy chủ.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
